name: Python SDK RC

on:
  push:
    branches: [rc]

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Unit tests
        run: python -m unittest discover tests -v

  integration:
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
    env:
      MUXI_SDK_E2E_SERVER_URL: ${{ secrets.MUXI_SDK_E2E_SERVER_URL }}
    steps:
      - name: Skip if no test server configured
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL == '' }}
        run: echo "::notice::Integration tests skipped — MUXI_SDK_E2E_SERVER_URL not set"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL != '' }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL != '' }}
        with:
          python-version: '3.10'
      - name: Install
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Integration tests
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL != '' }}
        env:
          MUXI_SDK_E2E_KEY_ID: ${{ secrets.MUXI_SDK_E2E_KEY_ID }}
          MUXI_SDK_E2E_SECRET_KEY: ${{ secrets.MUXI_SDK_E2E_SECRET_KEY }}
          MUXI_SDK_E2E_FORMATION_ID: ${{ secrets.MUXI_SDK_E2E_FORMATION_ID }}
          MUXI_SDK_E2E_CLIENT_KEY: ${{ secrets.MUXI_SDK_E2E_CLIENT_KEY }}
          MUXI_SDK_E2E_ADMIN_KEY: ${{ secrets.MUXI_SDK_E2E_ADMIN_KEY }}
        run: python -m unittest discover tests -v
